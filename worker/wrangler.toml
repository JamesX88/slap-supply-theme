name = "slap-bg-remover"
main = "index.js"
compatibility_date = "2024-09-01"

# ── R2 bucket binding ───────────────────────────────────────────────────────
# Create the bucket first: wrangler r2 bucket create slap-artwork
[[r2_buckets]]
binding = "ARTWORK_BUCKET"
bucket_name = "slap-artwork"

# ── Secrets (set via CLI — never commit real values) ────────────────────────
# wrangler secret put REPLICATE_API_TOKEN
# wrangler secret put ALLOWED_ORIGIN        (e.g. https://your-store.myshopify.com)
#
# ── Deploy ──────────────────────────────────────────────────────────────────
# npm install -g wrangler
# wrangler login
# wrangler r2 bucket create slap-artwork
# wrangler secret put REPLICATE_API_TOKEN
# wrangler secret put ALLOWED_ORIGIN
# wrangler deploy
